# RoboAdvisory — StackValues for the `production-values` environment.
#
# Complete, authoritative definition of every service in this environment.
# Deploy the whole stack with:
#
#   helm upgrade --install <release> ./RoboAdvisory \
#     -n prod-robo -f RoboAdvisory/StackValues/production-values.yaml
#
# To deploy a single service, layer its ServiceValues overlay on top of this
# file; see RoboAdvisory/README.md.
#
# compatibility.render gates the four fields the previous templates silently
# dropped. They are off so this refactor changes nothing on the first apply.
# Enable them one environment at a time — see docs/values-contract.md.

global:
  app:
    name: RoboAdvisory
    version: '1.0'
    namespace: prod-robo
  image:
    registry: ''
    pullPolicy: Always
    pullSecrets:
    - docker-secret
compatibility:
  render:
    resources: false
    probes: false
    command: false
    serviceAccountName: false
services:
  dataprocessingservice:
    image:
      repository: organisation/robo_dataprocessingservice
      tag: prod
    replicas: 1
    env:
    - name: SPRING_PROFILES_ACTIVE
      value: awsprod
    ports:
    - containerPort: 8095
    command:
    - java
    - -jar
    - "/opt/app/*.jar"
    resources:
      limits:
        cpu: 800m
        memory: 1200Mi
      requests:
        cpu: 500m
        memory: 756Mi
    readinessProbe:
      httpGet:
        path: /health/ok
        port: 8095
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 24
      successThreshold: 1
    livenessProbe:
      httpGet:
        path: /health/ok
        port: 8095
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
    service:
      ports:
      - port: 8095
        targetPort: 8095
        protocol: TCP
    targetGroupBindings:
    - name: dataprocessingservice-tgb
      serviceName: dataprocessingservice
      port: 8095
      targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:711387122713:targetgroup/prod-dataprocessing-tgb/10c2c79c0d740f18
