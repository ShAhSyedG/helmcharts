# RoboAdvisory — StackValues for the `dev-values` environment.
#
# Complete, authoritative definition of every service in this environment.
# Deploy the whole stack with:
#
#   helm upgrade --install <release> ./RoboAdvisory \
#     -n dev-robo -f RoboAdvisory/StackValues/dev-values.yaml
#
# To deploy a single service, layer its ServiceValues overlay on top of this
# file; see RoboAdvisory/README.md.
#
# compatibility.render gates the four fields the previous templates silently
# dropped. They are off so this refactor changes nothing on the first apply.
# Enable them one environment at a time — see docs/values-contract.md.

global:
  app:
    name: RoboAdvisory
    version: '1.0'
    namespace: dev-robo
  image:
    registry: ''
    pullPolicy: Always
    pullSecrets:
    - docker-secret
compatibility:
  render:
    resources: false
    probes: false
    command: false
    serviceAccountName: false
services:
  financialpanning:
    image:
      repository: organisation/robo_finplanningservice
      tag: dev
    replicas: 1
    env:
    - name: SPRING_PROFILES_ACTIVE
      value: awsuit
    ports:
    - containerPort: 8065
    command:
    - java
    - -jar
    - "/opt/app/*.jar"
    resources:
      limits:
        cpu: 800m
        memory: 1200Mi
      requests:
        cpu: 500m
        memory: 756Mi
    readinessProbe:
      httpGet:
        path: /health/ok
        port: 8065
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 24
      successThreshold: 1
    livenessProbe:
      httpGet:
        path: /health/ok
        port: 8065
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
    service:
      ports:
      - port: 8065
        targetPort: 8065
        protocol: TCP
  investor:
