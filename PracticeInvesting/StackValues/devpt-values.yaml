# PracticeInvesting — StackValues for the `devpt-values` environment.
#
# Complete, authoritative definition of every service in this environment.
# Deploy the whole stack with:
#
#   helm upgrade --install <release> ./PracticeInvesting \
#     -n dev-pt -f PracticeInvesting/StackValues/devpt-values.yaml
#
# To deploy a single service, layer its ServiceValues overlay on top of this
# file; see PracticeInvesting/README.md.
#
# compatibility.render gates the four fields the previous templates silently
# dropped. They are off so this refactor changes nothing on the first apply.
# Enable them one environment at a time — see docs/values-contract.md.
#
# This environment declared an `IngressRoute` block that no template ever read,
# so no Ingress exists for it today. It is carried over as `enabled: false`;
# set a certificateArn and flip it on deliberately.

global:
  app:
    name: practicetrading
    version: '1.0'
    namespace: dev-pt
  image:
    registry: ''
    pullPolicy: Always
    pullSecrets: []
  ingress:
    className: alb
    certificateArn: ''
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS",
        "Port": "443", "StatusCode": "HTTP_301"}}'
compatibility:
  render:
    resources: false
    probes: false
    command: false
    serviceAccountName: false
services:
  gateway:
    image:
      repository: tappeng/onboarding_gateway_pt
      tag: dev
    replicas: 1
    imagePullSecrets:
    - docker-secret
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Development
    ports:
    - containerPort: 80
    serviceAccountName: dev-sa
    command:
    - sh
    - -c
    - dotnet Gateway.dll
    autoscaling:
      enabled: false
    service:
      name: gatewayservice
      ports:
      - name: grpc
        protocol: TCP
        port: 80
        targetPort: 80
    ingress:
      enabled: false
      hosts:
      - host: tm-pt-live.tapengine.com
        paths:
        - path: /
          pathType: Prefix
          service: gatewayservice
          port: 80
  grpc-onboarding:
    image:
      repository: tappeng/onboarding_onboarding_pt_grpc
      tag: dev
    replicas: 1
    imagePullSecrets:
    - docker-secret
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Development
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - dotnet Trade.GRPC.dll
    autoscaling:
      enabled: false
    service:
      name: grpc-onboardingservice
      ports:
      - name: grpc
        protocol: TCP
        port: 7133
        targetPort: 80
  grpc-trade:
    image:
      repository: tappeng/onboarding_trade_pt_grpc
      tag: dev
    replicas: 1
    imagePullSecrets:
    - docker-secret
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Development
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - dotnet Trade.GRPC.dll
    autoscaling:
      enabled: false
    service:
      name: grpc-tradeservice
      ports:
      - name: grpc
        protocol: TCP
        port: 8182
        targetPort: 80
  onboarding-rest:
    image:
      repository: onboarding_onboarding_pt
      tag: dev
    replicas: 1
    imagePullSecrets:
    - docker-secret
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Development
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - dotnet OnBoarding.WebApi.dll
    autoscaling:
      enabled: false
    service:
      name: onboardingservice
      ports:
      - name: grpc
        protocol: TCP
        port: 7079
        targetPort: 80
  tenantmanagement:
    image:
      repository: tappeng/tenantmanagement
      tag: latest
    replicas: 1
    imagePullSecrets:
    - docker-secret
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Development
    ports:
    - containerPort: 8081
    - containerPort: 8082
    command:
    - sh
    - -c
    - java -jar /app/app.jar
    autoscaling:
      enabled: false
    service:
      name: tenantmanagementservice
      ports:
      - name: grpc
        protocol: TCP
        port: 8082
        targetPort: 8082
      - name: http
        protocol: TCP
        port: 8081
        targetPort: 8081
  trade-rest:
    image:
      repository: tappeng/onboarding_trade_pt
      tag: dev
    replicas: 1
    imagePullSecrets:
    - docker-secret
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Development
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - dotnet Trade.WebApi.dll
    autoscaling:
      enabled: false
    service:
      name: tradeservice
      ports:
      - name: grpc
        protocol: TCP
        port: 8182
        targetPort: 80
  tradetopup-rest:
    image:
      repository: tappeng/onboarding_tradetopup_pt
      tag: dev
    replicas: 1
    imagePullSecrets:
    - docker-secret
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Development
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - dotnet Trade.TopUp.dll
    autoscaling:
      enabled: false
    service:
      name: tradetopupservice
      ports:
      - name: grpc
        protocol: TCP
        port: 7079
        targetPort: 80
