# PracticeInvesting — StackValues for the `production-values` environment.
#
# Complete, authoritative definition of every service in this environment.
# Deploy the whole stack with:
#
#   helm upgrade --install <release> ./PracticeInvesting \
#     -n prod-pt -f PracticeInvesting/StackValues/production-values.yaml
#
# To deploy a single service, layer its ServiceValues overlay on top of this
# file; see PracticeInvesting/README.md.
#
# compatibility.render gates the four fields the previous templates silently
# dropped. They are off so this refactor changes nothing on the first apply.
# Enable them one environment at a time — see docs/values-contract.md.
#
# The `ingressgateway` Ingress was previously hardcoded in templates/ingress.yaml,
# so dev and qa releases also created it in the prod-pt namespace. It is scoped to
# production here.

global:
  app:
    name: practicetrading
    version: '1.0'
    namespace: prod-pt
  image:
    registry: ''
    pullPolicy: Always
    pullSecrets:
    - docker-secret
  ingress:
    className: alb
    certificateArn: arn:aws:acm:us-east-1:711387122713:certificate/4ef3ffbe-44c8-4e1f-b26b-d91241d68940
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS",
        "Port": "443", "StatusCode": "HTTP_301"}}'
compatibility:
  render:
    resources: false
    probes: false
    command: false
    serviceAccountName: false
services:
  gateway:
    image:
      repository: tappeng/onboarding_gateway_pt
      tag: prod
    replicas: 1
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Prod
    ports:
    - containerPort: 80
    serviceAccountName: dev-sa
    command:
    - sh
    - -c
    - dotnet Gateway.dll
    autoscaling:
      enabled: false
    service:
      name: gatewayservice
      ports:
      - name: grpc
        protocol: TCP
        port: 80
        targetPort: 80
    ingress:
      enabled: true
      name: ingressgateway
      hosts:
      - host: onboarding-pt-api.tappengine.com
        paths:
        - path: "/*"
          pathType: ImplementationSpecific
          service: gatewayservice
          port: 80
  grpc-onboarding:
    image:
      repository: tappeng/onboarding_onboarding_pt_grpc
      tag: dev
    replicas: 1
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Prod
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - dotnet Trade.GRPC.dll
    autoscaling:
      enabled: false
    service:
      name: grpc-onboardingservice
      ports:
      - name: grpc
        protocol: TCP
        port: 7133
        targetPort: 80
  grpc-trade:
    image:
      repository: tappeng/onboarding_trade_pt_grpc
      tag: dev
    replicas: 1
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Prod
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - dotnet Trade.GRPC.dll
    autoscaling:
      enabled: false
    service:
      name: grpc-tradeservice
      ports:
      - name: grpc
        protocol: TCP
        port: 8182
        targetPort: 80
  onboarding:
    image:
      repository: tappeng/onboarding_onboarding_lt
      tag: prod
    replicas: 1
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Prod
    ports:
    - containerPort: 7079
    autoscaling:
      enabled: false
    service:
      name: onboardingservice
      ports:
      - name: grpc
        protocol: TCP
        port: 7079
        targetPort: 80
  onboarding-rest:
    image:
      repository: tappeng/onboarding_onboarding_pt
      tag: dev
    replicas: 1
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Prod
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - dotnet OnBoarding.WebApi.dll
    autoscaling:
      enabled: false
    service:
      enabled: false
  recurring-trade-service:
    service:
      name: traderecurringservice
      ports:
      - name: grpc
        protocol: TCP
        port: 9091
        targetPort: 9091
  trade-rest:
    image:
      repository: tappeng/onboarding_trade_pt
      tag: dev
    replicas: 1
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Prod
    ports:
    - containerPort: 80
    command:
    - sh
    - -c
    - dotnet Trade.WebApi.dll
    autoscaling:
      enabled: false
    service:
      name: tradeservice
      ports:
      - name: grpc
        protocol: TCP
        port: 8182
        targetPort: 80
  tradeexecutionreport-rest:
    image:
      repository: tappeng/onboarding_trade_execution_report_pt
      tag: prod
    replicas: 1
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Prod
    ports:
