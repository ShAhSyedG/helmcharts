# LiveInvest — StackValues for the `dev-values` environment.
#
# Complete, authoritative definition of every service in this environment.
# Deploy the whole stack with:
#
#   helm upgrade --install <release> ./LiveInvest \
#     -n dev-lt -f LiveInvest/StackValues/dev-values.yaml
#
# To deploy a single service, layer its ServiceValues overlay on top of this
# file; see LiveInvest/README.md.
#
# compatibility.render gates the four fields the previous templates silently
# dropped. They are off so this refactor changes nothing on the first apply.
# Enable them one environment at a time — see docs/values-contract.md.

global:
  app:
    name: LiveInvesting
    version: '1.0'
    namespace: dev-lt
  image:
    registry: ''
    pullPolicy: Always
    pullSecrets:
    - docker-secret
compatibility:
  render:
    resources: false
    probes: false
    command: false
    serviceAccountName: false
services:
  accountopening-grpcservice:
    image:
      repository: organisation/onboarding_accountopening_grpc
      tag: dev
    replicas: 1
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Development
    ports:
    - containerPort: 80
    command:
    - dotnet
    - AccountOpening.GRPC.dll
    resources:
      limits:
        cpu: 800m
        memory: 900Mi
      requests:
        cpu: 500m
        memory: 756Mi
    readinessProbe:
      httpGet:
        path: /health/ok
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 24
      successThreshold: 1
    livenessProbe:
      httpGet:
        path: /health/ok
        port: 80
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
    service:
      name: accountopening-grpc-service
      ports:
      - port: 7133
        targetPort: 80
        protocol: TCP
  accountopeningservice:
